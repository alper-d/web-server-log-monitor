# The single Grafana-managed alert rule, evaluated against the `apache-loki`
# datasource.
#
# READ-ONLY in the UI (provisioned). Edit here, then:
#   docker compose restart grafana
#
# A malformed file here is FATAL, not survivable: unlike dashboard provisioning,
# a rejected rule stops the provisioning service and the container restart-loops
# with "Failed to provision alerting". Always check `docker ps` afterwards.
apiVersion: 1

groups:
  - orgId: 1
    name: apache
    folder: Apache
    interval: 1m
    rules:

      # ---------------------------------------------------------------------
      # Scanner surge: the share of traffic being blocked or not-found, judged
      # against the SAME CLOCK TIME ONE WEEK AGO rather than a fixed percentage.
      #
      # SCOPED TO ONE VHOST ON PURPOSE: every selector below carries
      # vhost="fairdomhub". To widen it, delete those five matchers -- but
      # re-calibrate first. The +15pp threshold was measured against
      # fairdomhub's traffic profile alone, and a vhost with a different
      # baseline shape needs its own number. Note the volume guard alone used to
      # do this filtering as a side effect, which meant a quiet vhost growing
      # past 1000 requests/30m would have started paging silently.
      #
      # Why the week-over-week baseline is the whole design:
      #
      #   A fixed threshold cannot work on this data. Total traffic swings 3x
      #   across the day (34k-103k requests/hour) and the 40x share independently
      #   swings 3.5%-31% by hour. The largest 40x spike in a sample 24h -- 73% --
      #   happened at 02:40, purely because legitimate traffic drains away at
      #   night while scanners keep going at a constant rate. Any fixed cutoff
      #   either pages every night or misses daytime campaigns.
      #
      #   `offset 7d` lands on the same weekday at the same clock time, so the
      #   diurnal AND the weekday/weekend shape both cancel. It also needs no
      #   timezone handling at all, which matters because APACHE_TZ describes the
      #   host that WROTE the logs, not the reader.
      #
      # Measured separation (30m window, percentage-point delta):
      #   quiet weeks     median -0.2pp   p95  0.4pp   max  6.6pp
      #   active campaign median  4.2pp   p95 34.4pp   max 55.9pp
      # The +15 threshold sits ~2.3x above the worst quiet-period reading.
      #
      # Why 30m: quiet-period noise peaks at 12.2pp with a 15m window, 6.6pp at
      # 30m, 3.6pp at 1h. 30m is the fastest window that keeps real margin.
      #
      # Why SUBTRACTION and not a ratio of ratios: the week-ago share is often
      # near zero (0.24% in one measured hour, against 28.8% live), and dividing
      # by it produces unstable near-infinite values. Percentage points stay
      # bounded and mean something to a human reading the alert.
      #
      # Why NOT method= or user_agent=: measured on this data, method="OTHER"
      # matched 1 request in 1,358,176, and the top user agents on 403 responses
      # are byte-identical to those on 200s (spoofed Chrome). Status code is the
      # only discriminator that actually works here.
      #
      # Cost: `status` and `vhost` are stream labels, so this is answered from
      # the index -- measured at 0.11s against a 1m evaluation interval. Do not
      # rewrite it to group by remote_addr/path/user_agent; see CLAUDE.md on
      # max_query_series and the LOKI_MEM cliff.
      # ---------------------------------------------------------------------
      - uid: apache-scanner-surge
        title: Scanner surge (40x share vs same time last week)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        labels:
          severity: warning
          component: http
        annotations:
          summary: >-
            {{ $labels.vhost }}: blocked/not-found responses are {{ $values.B }}
            percentage points above the same time last week
          description: >-
            The 403/404 share of traffic is far above its own seasonal baseline
            for this hour and weekday, which is what a scraping or scanning
            campaign looks like once time-of-day variation is removed. Check the
            Top 10 client IPs and Top 10 paths panels on the approx dashboard.
            Scope: this rule watches the fairdomhub vhost only.
            NOTE: this alert resolving means "no longer unusual for this hour",
            NOT "the scanning stopped" -- a campaign running longer than 7 days
            becomes its own baseline.
          __dashboardUid__: apache-traffic-approx
          __panelId__: '3'
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: apache-loki
            model:
              refId: A
              queryType: instant
              editorMode: code
              intervalMs: 60000
              maxDataPoints: 43200
              # The trailing `and (... > 1000)` is a minimum-volume guard. With
              # the vhost pinned it no longer separates vhosts, but it still
              # covers the degenerate case that matters: if fairdomhub's OWN
              # traffic collapses during a partial outage, a handful of 404s
              # against a tiny denominator reads as a huge swing. fairdomhub
              # normally runs ~25000-42000 requests/30m, so this only engages
              # when something is already badly wrong.
              expr: >-
                100 * ((sum by (vhost) (count_over_time({job="apache", log_type="access", vhost="fairdomhub", status=~"40[34]"}[30m]))
                / sum by (vhost) (count_over_time({job="apache", log_type="access", vhost="fairdomhub"}[30m])))
                - (sum by (vhost) (count_over_time({job="apache", log_type="access", vhost="fairdomhub", status=~"40[34]"}[30m] offset 7d))
                / sum by (vhost) (count_over_time({job="apache", log_type="access", vhost="fairdomhub"}[30m] offset 7d))))
                and (sum by (vhost) (count_over_time({job="apache", log_type="access", vhost="fairdomhub"}[30m])) > 1000)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [15] }
