auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

  # These two exist because the 4MB gRPC default turns an over-limit query into
  # a HANG rather than an error, which is indistinguishable from a broken
  # dashboard. The internal path is querier -> query frontend: a sharded query's
  # per-shard result travels back over gRPC, and the "Top 10" panels' inner
  # `sum by (<high-cardinality field>)` makes that payload scale with distinct
  # values, not with the 10 rows displayed. At a 24h range on this dataset it is
  # ~4.9MB, so the frontend answers every shard with
  #   ResourceExhausted: grpc: received message larger than max (4910813 vs. 4194304)
  # (logged querier-side as "error notifying frontend about finished query").
  # Neither the results NOR the accompanying
  # "maximum of series (100000) reached for a single query" 400 can be
  # delivered; the frontend retries, no response header is ever written, and
  # Grafana reports it at the 60s mark as
  #   net/http: request canceled (Client.Timeout exceeded while awaiting headers)
  # -- a message that points at neither the series limit nor gRPC.
  #
  # Raising these does not make an unbounded topk() affordable (max_query_series
  # and LOKI_MEM still apply, in that order). It makes the refusal legible.
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

  # Must exceed limits_config.query_timeout, or a query that hits the timeout
  # cannot deliver the 504 that says so. At the 30s default a 7d dashboard load
  # produced 13 panels' worth of "Remote end closed connection without response"
  # -- the queries were cancelled at query_timeout (60s), by which point the
  # write deadline had long passed and the connection was simply dropped. Same
  # class of silent failure as the gRPC ceiling above: the wall is real, the
  # message explaining it is what goes missing.
  http_server_write_timeout: 90s

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  # Durability tuning for a LOW-TRAFFIC host. With Loki's defaults
  # (chunk_idle_period 30m, max_chunk_age 2h, wal.flush_on_shutdown false) a
  # stream with a handful of lines sits in an in-memory head chunk for up to
  # half an hour. A restart or reboot then loses it: WAL replay came back with
  # "no checkpoint found" and recovered nothing in testing, so recent requests
  # simply vanished while the older backfill (already aged out and flushed)
  # survived. These settings trade storage efficiency -- irrelevant at this
  # volume -- for not losing traffic data.
  chunk_idle_period: 2m
  # 2h rather than 1h: a little more tolerance for entries arriving behind a
  # stream's high-water mark during a bulk import, which is what
  # scripts/import_logs.py reports as "Dropped by Loki ... outside its
  # out-of-order window". Do NOT raise this much further on a memory-capped
  # deployment -- it directly controls how long chunks stay resident, and 12h
  # was enough to get the ingester OOM-killed inside a 512m cgroup.
  max_chunk_age: 2h
  chunk_retain_period: 30s

  # Memory, not storage efficiency, is the binding constraint here. Open chunks
  # are held per stream, so the ingester's footprint is roughly
  # (active streams x chunk_target_size). At ~1000 streams -- 6 vhosts times the
  # methods and statuses they see -- the 1.5MB default alone exceeds a 512m
  # budget before anything else is counted. 512KB keeps that term near 500MB and
  # costs only slightly worse compression.
  chunk_target_size: 524288
  chunk_block_size: 262144

  # Drain flushed chunks out of memory faster, so a bulk import doesn't build a
  # backlog of chunks waiting to be written.
  concurrent_flushes: 16
  flush_check_period: 15s
  wal:
    enabled: true
    dir: /loki/wal
    # Write in-memory chunks to the store on a graceful shutdown. Paired with
    # stop_grace_period on the loki service in docker-compose.yml.
    flush_on_shutdown: true

schema_config:
  configs:
    # `from` MUST predate the oldest timestamp we ingest, and getting this wrong
    # fails silently: Loki answers the push with HTTP 204 and stores the entry,
    # but no index period covers it, so queries return nothing forever.
    #
    # The oldest archive here is access.log.10.gz at 2023-11-29 -- the whole
    # `default` vhost family is from Nov/Dec 2023, while every other vhost starts
    # Jul 2025 or later. At the previous value of 2024-01-01 those 611 entries
    # imported "successfully" and were unqueryable. Lower this, never raise it,
    # and re-import anything that was already pushed below the old boundary.
    - from: 2023-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # CRITICAL for the backfill: Loki otherwise rejects anything older than
  # reject_old_samples_max_age (default 1 week) and would silently discard
  # nearly all of the archived history.
  reject_old_samples: false

  # Lets high-cardinality fields (client IP, path, user-agent) be attached
  # per-line and filtered in LogQL without exploding the stream count.
  allow_structured_metadata: true

  # Accept backfilled lines that arrive out of order relative to live tailing.
  unordered_writes: true

  # No ceiling on how far back queries may look (0 = unlimited), so the
  # 2024/2025 entries stay reachable from the dashboard time picker.
  max_query_lookback: 0s

  # Loki caps a single query's time span at 721h (~30d) by default, which makes
  # any dashboard range wider than a month fail with HTTP 400. 0 = no limit,
  # needed to view the backfilled history in one shot.
  max_query_length: 0s

  # Enables the "Volume" / log-volume features in Grafana's Loki explorer.
  volume_enabled: true

  # Sized for the historical import, not for steady-state traffic: the archives
  # are ~19 GB of access logs across ~58M lines. The defaults (4 MB/s global,
  # 3 MB/s per stream) turn that into a multi-day crawl -- the importer backs off
  # and retries on 429 rather than losing data, so the symptom is slowness, not
  # loss. Lower these once the backfill is in if this host ever faces real
  # traffic and you want the rate limit to act as a brake again.
  ingestion_rate_mb: 32
  # Burst is a memory cost in the distributor, so it stays modest on a
  # memory-capped host. 32MB is still 8x the stock burst.
  ingestion_burst_size_mb: 32

  # The global limit above is not the binding one during an import. Traffic is
  # heavily skewed -- one vhost's GET/200 stream carries a large share of all
  # 58M lines -- so the PER-STREAM ceiling is what gets hit first.
  per_stream_rate_limit: 32MB
  per_stream_rate_limit_burst: 64MB

  max_streams_per_user: 5000
  max_label_names_per_series: 20

  # The dashboard's three "Top 10" panels are topk(10, sum by (<high-cardinality
  # field>) (...)), and query sharding pushes that inner aggregation down to each
  # shard -- so a shard emits one series per distinct client IP / path / user
  # agent and the 500 default rejects the query with "maximum of series (500)
  # reached for a single query" before topk ever trims it to 10. The ceiling must
  # therefore exceed the DISTINCT VALUE COUNT in the widest range viewed, not the
  # 10 rows displayed. Same for the "Unique client IPs" stat, which is
  # count(sum by (remote_addr) (...)).
  #
  # This is a querier memory cost: the merged vector is held in full before it is
  # reduced, so raising this eats into the same LOKI_MEM budget as the ingester's
  # open chunks. Measure before raising it further (instant query, whole span):
  #   count(sum by (remote_addr) (count_over_time({job="apache", log_type="access"}[52w])))
  # If a panel still hits the limit at a value this host cannot afford, use the
  # approx_topk() variant of the dashboard (see shard_aggregations below) -- it
  # sketches instead of materialising, so its memory is bounded.
  max_query_series: 100000

  # Enables approx_topk(), which the "Apache Traffic (approx)" dashboard uses in
  # place of topk() for its three Top 10 panels. Instead of materialising one
  # series per distinct value and sorting, each shard builds a Count-Min Sketch
  # and only the sketches are merged, so memory is bounded by the sketch size
  # rather than by cardinality -- and max_query_series stops being the ceiling on
  # how wide a range those panels can cover. Necessary here because a 5-minute
  # window alone holds ~19k distinct client IPs (21k requests, nearly one IP per
  # request), so any range of a day or more runs to millions of series.
  #
  # The token is `approx_topk`; the -querier.shard-aggregations help text lists
  # only the quantile/first/last aggregations and is out of date. Without this,
  # the query fails outright with "approx_topk is not enabled", and it is
  # supported for INSTANT queries only -- all three panels are instant.
  #
  # Counts are approximate by construction: the 10 rows and their values can be
  # slightly off for values with near-identical traffic. That is the trade for
  # unbounded-cardinality grouping.
  shard_aggregations:
    - approx_topk

querier:
  # THE dashboard bottleneck, and it does not look like one from the outside.
  # A dashboard load fires every panel at once -- 14 on apache-traffic-approx --
  # and each is split into subqueries by limits_config.split_queries_by_interval
  # (1h), so a 24h range is 24 subqueries per panel and 7d is 168. All of them
  # funnel through max_concurrent, whose default of 4 is the entire pipe on a
  # 16-CPU host. The other parallelism knobs promise far more than that default
  # can deliver (max_query_parallelism 32, tsdb_max_query_parallelism 128); they
  # are ceilings on how far a query MAY be split, not on how much runs at once.
  #
  # Measured on the 24h window, all 14 panels fired concurrently:
  #   max_concurrent: 4  -> 15.6s wall, 141s exec, 702s queue
  # Queue time was 5x execution time -- the queries were not slow, they were
  # waiting. Per-panel exec inflated ~7x under contention versus running the same
  # query alone ("Total requests": 1.75s alone, 11.0s in the burst).
  #
  # 12 on 16 CPUs leaves headroom for the ingester and compactor. Raising this
  # raises peak memory too -- more subqueries hold results at once -- so it moves
  # together with LOKI_MEM, not independently of it.
  max_concurrent: 6

query_range:
  # Loki caches NOTHING by default: cache_results and
  # cache_instant_metric_results are both false out of the box (confirmed
  # against this build via `curl http://127.0.0.1:3100/config`). Every panel
  # load, and every tick of the dashboard's auto-refresh, re-read the chunks.
  #
  # This deployment is the ideal case for a results cache: the data is
  # historical (fairdomhub spans 2026-07-09..2026-08-06), and
  # max_cache_freshness_per_query only withholds the most recent 10m, so
  # essentially every window a user actually looks at is cacheable.
  cache_results: true

  # Without step alignment the cache almost never hits: two loads of "the same"
  # range start at different wall-clock instants, so their step boundaries do
  # not line up and no cached sub-range is reusable. This is what makes
  # cache_results worth having rather than merely enabled.
  align_queries_with_step: true

  # cache_results covers query_range only, and 8 of this dashboard's 14 panels
  # are queryType: instant -- the six stat tiles, the methods pie and the three
  # approx_topk panels. Without this the cache would miss exactly the panels the
  # dashboard waits longest on.
  cache_instant_metric_results: true
  instant_metric_query_split_align: true

  # The embedded cache is IN-PROCESS: it is charged to the same LOKI_MEM cgroup
  # ceiling as the ingester's open chunks, and that ceiling is a hard cliff (see
  # docker-compose.yml). 256MB each was chosen against LOKI_MEM=4g, not against
  # the old 2g -- do not restore 2g while these are enabled.
  #
  # cache_index_stats_results, cache_volume_results, cache_series_results and
  # cache_label_results are already true by DEFAULT in this version and are
  # deliberately not repeated here.
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256
  instant_metric_results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

# The querier side of the same querier -> frontend hop guarded in `server`
# above. Both ends need raising: the frontend's receive ceiling comes from
# server.grpc_server_max_recv_msg_size, and this is the worker's matching send
# ceiling. Lift only one and the payload is still rejected, just by the other
# end.
frontend_worker:
  grpc_client_config:
    max_send_msg_size: 104857600

frontend:
  # Required by limits_config.shard_aggregations above, and the whole reason this
  # section exists. approx_topk is sharded into Count-Min Sketches, and a sketch
  # is a binary structure that has to travel from each querier back to the query
  # frontend. The default 'json' codec cannot carry one: the sharded plan is
  # serialised as a LogQL string instead, the internal sketch expression is not
  # valid LogQL input, and the querier rejects its own query with
  # "parse error at line 1, col 1: syntax error: unexpected IDENTIFIER".
  # Nothing in that message points at the codec, and enabling shard_aggregations
  # without this looks like a broken dashboard query.
  encoding: protobuf

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  # Keep everything forever. Enabling retention here would let the compactor
  # delete the backfilled 2024/2025 history. Total volume is negligible.
  # To start expiring data later, set retention_enabled: true and add
  # limits_config.retention_period (e.g. 2160h for 90 days).
  retention_enabled: false

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
